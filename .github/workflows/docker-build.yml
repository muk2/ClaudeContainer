name: Docker Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'claude/Dockerfile.*'
      - 'opencodeLLM/Dockerfile.*'
      - '.github/workflows/docker-build.yml'
  push:
    branches: [main]
    paths:
      - 'claude/Dockerfile.*'
      - 'opencodeLLM/Dockerfile.*'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.detect.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed Dockerfiles
        id: detect
        run: |
          set -euo pipefail

          to_json() {
            local first=true
            printf '['
            for f; do
              $first || printf ','
              first=false
              local dir; dir="$(dirname "$f")"
              local base; base="$(basename "$f")"
              local variant="${base#Dockerfile.}"
              local name="${dir////-}-${variant}"
              name="${name,,}"
              printf '{"name":"%s","file":"%s","context":"%s"}' "$name" "$f" "$dir"
            done
            printf ']'
          }

          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch|push)
              FILES=(claude/Dockerfile.* opencodeLLM/Dockerfile.*)
              ;;
            pull_request)
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
              git fetch --depth=1 origin "$BASE_SHA" 2>/dev/null || true
              readarray -t CHANGED < <(
                git diff --name-only "$BASE_SHA"...HEAD -- \
                  'claude/Dockerfile.*' 'opencodeLLM/Dockerfile.*' 2>/dev/null || true
              )
              if [ ${#CHANGED[@]} -eq 0 ]; then
                FILES=(claude/Dockerfile.python claude/Dockerfile.go opencodeLLM/Dockerfile.oc-python opencodeLLM/Dockerfile.oc-go)
              else
                FILES=("${CHANGED[@]}")
              fi
              ;;
            *)
              FILES=()
              ;;
          esac

          EXIST=()
          for f in "${FILES[@]}"; do
            [ -f "$f" ] && EXIST+=("$f")
          done

          JSON=$(to_json "${EXIST[@]}")
          echo "targets=$JSON" >> "$GITHUB_OUTPUT"
          echo "Targets: $JSON"

  build:
    needs: detect
    if: ${{ fromJSON(needs.detect.outputs.targets)[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect.outputs.targets) }}
    timeout-minutes: 60
    env:
      DOCKER_BUILDKIT: 1
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          df -h /

      - name: Build ${{ matrix.target.name }}
        run: |
          echo "Building ${{ matrix.target.name }}"
          echo "  Dockerfile: ${{ matrix.target.file }}"
          echo "  Context:    ${{ matrix.target.context }}"
          docker buildx create --use --name ci-builder 2>/dev/null || true
          docker buildx build \
            --load \
            --progress=plain \
            -t "${{ matrix.target.name }}:ci" \
            -f "${{ matrix.target.file }}" \
            "${{ matrix.target.context }}"

      - name: Image size
        run: |
          SIZE=$(docker image inspect "${{ matrix.target.name }}:ci" \
            --format '{{ .Size }}' 2>/dev/null || echo 0)
          echo "Image size: $(numfmt --to=iec $SIZE)"
