name: CI diagnose

# Self-reporting diagnostic workflow. Since we currently can't access
# Forgejo Actions logs via the API, this workflow writes its findings
# back to the PR as a comment so we can see what the runner environment
# actually looks like. Delete this file once build-containers.yml is healthy.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  diag:
    name: Diagnose runner environment
    runs-on: ubuntu-latest
    steps:
      - name: Gather environment info
        id: gather
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/diag.md"
          {
            echo "## CI runner diagnostics"
            echo ""
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Event: \`${GITHUB_EVENT_NAME}\`"
            echo "Run: \`${GITHUB_RUN_ID}\` / \`${GITHUB_RUN_NUMBER}\`"
            echo ""
            echo "### Identity"
            echo '```'
            echo "hostname: $(hostname 2>&1)"
            echo "whoami:   $(whoami 2>&1)"
            echo "id:       $(id 2>&1)"
            echo "pwd:      $(pwd 2>&1)"
            echo "uname:    $(uname -a 2>&1)"
            echo "os-release:"
            (cat /etc/os-release 2>&1 || echo "no /etc/os-release") | sed 's/^/  /'
            echo '```'
            echo ""
            echo "### Tools"
            echo '```'
            for cmd in bash sh git docker buildx jq curl wget node python python3 podman; do
              v=$(command -v "$cmd" 2>/dev/null)
              if [ -n "$v" ]; then
                ver=$("$cmd" --version 2>&1 | head -1)
                printf '%-10s %-50s %s\n' "$cmd" "$v" "$ver"
              else
                printf '%-10s MISSING\n' "$cmd"
              fi
            done
            echo '```'
            echo ""
            echo "### Docker reachability"
            echo '```'
            docker info 2>&1 | head -25
            echo '```'
            echo ""
            echo "### Disk"
            echo '```'
            df -h / "$RUNNER_TEMP" 2>&1 | head -5
            echo '```'
            echo ""
            echo "### Environment (filtered)"
            echo '```'
            env | sort | grep -Ev '^(GITHUB_TOKEN|ACTIONS_RUNTIME_TOKEN|ACTIONS_ID_TOKEN)' | head -60
            echo '```'
          } > "$OUT" 2>&1
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "--- begin diag.md ---"
          cat "$OUT"
          echo "--- end diag.md ---"

      - name: Push diagnostics to ci-debug branch
        shell: bash
        env:
          DEBUG_TOKEN: ${{ secrets.CI_DEBUG_TOKEN }}
        run: |
          set -e
          if [ -z "${DEBUG_TOKEN:-}" ]; then
            echo "CI_DEBUG_TOKEN secret is empty"
            exit 1
          fi
          OUT="${{ steps.gather.outputs.out }}"
          WORK=$(mktemp -d)
          cd "$WORK"
          # Server URL strip http:// for inline-credential format
          BASEURL="${GITHUB_SERVER_URL#http://}"
          BASEURL="${BASEURL#https://}"
          REMOTE="http://oauth2:${DEBUG_TOKEN}@${BASEURL}/${GITHUB_REPOSITORY}.git"

          git init -q
          git config user.email "ci@forgejo"
          git config user.name "ci-debug"
          git remote add origin "$REMOTE"

          # Try to fetch the existing ci-debug branch (may not exist)
          git fetch --depth=1 origin ci-debug 2>/dev/null && \
            git checkout -B ci-debug FETCH_HEAD || \
            git checkout --orphan ci-debug

          # Always start clean
          git rm -rf . 2>/dev/null || true
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          cp "$OUT" "diag-${STAMP}.md"
          cp "$OUT" "diag-latest.md"

          git add diag-*.md
          git commit -m "diag: run ${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:8})"
          git push -f origin ci-debug
          echo "Pushed diag-${STAMP}.md to ci-debug branch"
