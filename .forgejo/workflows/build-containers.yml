name: Build container images

# Validates Dockerfiles on every PR. Runs on a runner that does NOT have
# Docker available (act_runner with node:20-bookworm-slim image), so a real
# `docker build` is impossible. Instead this workflow:
#
#   1. Statically lints each changed Dockerfile with `hadolint` to catch
#      syntax errors, broken RUN chains, missing version pins, etc.
#   2. Verifies the Dockerfile parses (`docker build --check`-equivalent
#      done via hadolint's BuildKit-aware rule set).
#
# To run REAL `docker build` in CI you must either:
#   - Configure the act_runner to mount /var/run/docker.sock from the host
#     into the job container (forgejo-runner config.yaml: `docker_host`).
#   - Or switch the runner image to one that ships docker-in-docker
#     (e.g. catthehacker/ubuntu:full).
# Until that happens, hadolint is the closest we can get on this runner.

on:
  pull_request:
    branches: [main]
    paths:
      - 'claude/Dockerfile.*'
      - 'opencodeLLM/Dockerfile.*'
      - 'claude/forgejo-entrypoint.sh'
      - 'opencodeLLM/entrypoint.sh'
      - '.forgejo/workflows/build-containers.yml'
  push:
    branches: [main]
    paths:
      - 'claude/Dockerfile.*'
      - 'opencodeLLM/Dockerfile.*'
      - 'claude/forgejo-entrypoint.sh'
      - 'opencodeLLM/entrypoint.sh'
      - '.forgejo/workflows/build-containers.yml'
  workflow_dispatch:
    inputs:
      lint_all:
        description: "Lint every Dockerfile, not just changed ones"
        type: boolean
        default: false

jobs:
  lint:
    name: Lint changed Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        shell: bash
        run: |
          set -e
          # Workspace may already be populated; clean-init either way.
          rm -rf .git
          git init -q
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=50 origin "${GITHUB_SHA}"
          git checkout -q "${GITHUB_SHA}"
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --depth=50 origin "${GITHUB_BASE_REF}"
          fi

      - name: Install hadolint
        shell: bash
        run: |
          set -e
          # Pick arch for the released binary.
          case "$(uname -m)" in
            aarch64|arm64) HADO_ARCH=arm64 ;;
            x86_64|amd64)  HADO_ARCH=x86_64 ;;
            *) echo "Unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          # Download the hadolint binary. Mirrored on github.com — if that's
          # blocked we fall back to apt's hadolint (older but functional).
          if curl -fsSL -o /tmp/hadolint \
              "https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-${HADO_ARCH}"; then
            chmod +x /tmp/hadolint
            sudo mv /tmp/hadolint /usr/local/bin/hadolint
          else
            echo "github.com unreachable; falling back to apt"
            sudo apt-get update -qq
            sudo apt-get install -y -qq hadolint || {
              echo "hadolint not in apt either; aborting"
              exit 1
            }
          fi
          hadolint --version

      - name: Determine which Dockerfiles to lint
        id: pick
        shell: bash
        run: |
          set -e
          TARGETS=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.lint_all }}" = "true" ]; then
            TARGETS=$(printf '%s\n' claude/Dockerfile.* opencodeLLM/Dockerfile.* 2>/dev/null \
                     | grep -v '\*$' || true)
          else
            BASE=""
            if [ -n "${GITHUB_BASE_REF:-}" ]; then
              BASE="origin/${GITHUB_BASE_REF}"
            else
              BASE="${GITHUB_SHA}^"
            fi
            if git rev-parse --verify -q "$BASE" >/dev/null; then
              echo "Diffing against: $BASE"
              CHANGED=$(git diff --name-only "$BASE" "${GITHUB_SHA}" || true)
            else
              echo "Base $BASE not reachable; falling back to listing all Dockerfiles"
              CHANGED=$(printf '%s\n' claude/Dockerfile.* opencodeLLM/Dockerfile.* 2>/dev/null \
                       | grep -v '\*$' || true)
            fi
            echo "--- changed files ---"
            echo "$CHANGED"
            echo "----------------------"

            SHARED=false
            if echo "$CHANGED" | grep -qE \
                '(claude/forgejo-entrypoint\.sh|opencodeLLM/entrypoint\.sh|\.forgejo/workflows/build-containers\.yml)$'; then
              SHARED=true
            fi

            TARGETS=$(echo "$CHANGED" | grep -E '^(claude|opencodeLLM)/Dockerfile\.' || true)

            if [ "$SHARED" = "true" ] && [ -z "$TARGETS" ]; then
              echo "Shared file changed; linting canary set"
              TARGETS=$'claude/Dockerfile.python\nclaude/Dockerfile.go\nopencodeLLM/Dockerfile.oc-python\nopencodeLLM/Dockerfile.oc-go'
            fi
          fi

          # Verify each target file actually exists (renames in the diff
          # can list old paths).
          REAL=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ -f "$f" ]; then
              REAL="${REAL}${f}"$'\n'
            else
              echo "Skipping nonexistent: $f"
            fi
          done <<< "$TARGETS"

          # Strip trailing newline and stash for next step.
          printf '%s' "${REAL%$'\n'}" > /tmp/targets.txt
          if [ -s /tmp/targets.txt ]; then
            echo "Will lint:"
            cat /tmp/targets.txt | sed 's/^/  /'
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to lint."
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint Dockerfiles
        if: steps.pick.outputs.has_targets == 'true'
        shell: bash
        run: |
          set -e
          FAILED=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo "  $f"
            echo "════════════════════════════════════════════════════════════"
            # --no-fail keeps hadolint exit code at 0 even on warnings.
            # We want WARNINGS to be informational but ERRORS to fail the job,
            # so we run twice: once for the human-readable report, once to
            # decide the exit code based on severity 'error' only.
            hadolint --no-fail "$f" || true
            if ! hadolint --failure-threshold error "$f" >/dev/null 2>&1; then
              echo ">>> ERROR-level issues in $f"
              FAILED=$((FAILED + 1))
            fi
          done < /tmp/targets.txt

          if [ "$FAILED" -gt 0 ]; then
            echo ""
            echo "$FAILED Dockerfile(s) had error-level issues."
            exit 1
          fi
          echo ""
          echo "All Dockerfiles passed hadolint."
