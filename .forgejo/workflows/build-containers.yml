name: Build container images

# Validate that every Dockerfile touched by a PR still builds.
# Designed to stay cheap on a self-hosted Forgejo runner:
#   - Path-filtered so unrelated PRs (README, docs, shell aliases) skip this entirely.
#   - Matrix builds only the Dockerfiles that actually changed in the diff.
#   - Dockerfile.all (8-10 GB) is intentionally excluded from PR-triggered runs;
#     trigger it manually via workflow_dispatch with build_all=true when needed.

on:
  pull_request:
    branches: [main]
    paths:
      - 'claude/Dockerfile.*'
      - 'opencodeLLM/Dockerfile.*'
      - 'claude/forgejo-entrypoint.sh'
      - 'opencodeLLM/entrypoint.sh'
      - '.forgejo/workflows/build-containers.yml'
  push:
    branches: [main]
    paths:
      - 'claude/Dockerfile.*'
      - 'opencodeLLM/Dockerfile.*'
      - 'claude/forgejo-entrypoint.sh'
      - 'opencodeLLM/entrypoint.sh'
      - '.forgejo/workflows/build-containers.yml'
  workflow_dispatch:
    inputs:
      build_all:
        description: "Build every Dockerfile, including Dockerfile.all"
        type: boolean
        default: false

jobs:
  # ─────────────────────────────────────────────────────────
  # Detect which Dockerfiles need building based on the diff
  # ─────────────────────────────────────────────────────────
  detect:
    name: Detect changed Dockerfiles
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.set-matrix.outputs.images }}
      should_build: ${{ steps.set-matrix.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute build matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          # Canary set — built when shared files (entrypoints, workflow itself) change
          # but no specific Dockerfile did. Keeps a meaningful signal without
          # full-fanout cost.
          CANARY=(
            "claude/python"
            "claude/go"
            "opencodeLLM/oc-python"
            "opencodeLLM/oc-go"
          )

          IMAGES=()

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.build_all }}" = "true" ]; then
            echo "workflow_dispatch + build_all=true -> building everything"
            for f in claude/Dockerfile.*; do
              name="${f#claude/Dockerfile.}"
              IMAGES+=("claude/$name")
            done
            for f in opencodeLLM/Dockerfile.*; do
              name="${f#opencodeLLM/Dockerfile.}"
              IMAGES+=("opencodeLLM/$name")
            done
          else
            # Diff against the merge target (PR) or previous commit (push)
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              git fetch origin "${{ github.base_ref }}" --depth=1 || true
              BASE="origin/${{ github.base_ref }}"
            else
              BASE="HEAD~1"
            fi

            echo "Diffing against: $BASE"
            CHANGED=$(git diff --name-only "$BASE" HEAD || true)
            echo "Changed files:"
            echo "$CHANGED"

            SHARED_TOUCHED=false
            if echo "$CHANGED" | grep -qE \
                '(claude/forgejo-entrypoint\.sh|opencodeLLM/entrypoint\.sh|\.forgejo/workflows/build-containers\.yml)$'; then
              SHARED_TOUCHED=true
            fi

            # Add specific Dockerfiles that changed
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                claude/Dockerfile.*)
                  name="${f#claude/Dockerfile.}"
                  # Skip Dockerfile.all unless explicitly opted in via workflow_dispatch
                  if [ "$name" = "all" ]; then
                    echo "Skipping Dockerfile.all (use workflow_dispatch to build it)"
                    continue
                  fi
                  IMAGES+=("claude/$name")
                  ;;
                opencodeLLM/Dockerfile.*)
                  name="${f#opencodeLLM/Dockerfile.}"
                  IMAGES+=("opencodeLLM/$name")
                  ;;
              esac
            done <<< "$CHANGED"

            # If shared file changed but no specific image changed, fall back to canary
            if [ "$SHARED_TOUCHED" = true ] && [ ${#IMAGES[@]} -eq 0 ]; then
              echo "Shared file changed but no specific Dockerfile -- using canary set"
              IMAGES=("${CANARY[@]}")
            fi
          fi

          if [ ${#IMAGES[@]} -eq 0 ]; then
            echo "No images to build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "images=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Dedupe + emit JSON for the matrix
          UNIQUE=$(printf '%s\n' "${IMAGES[@]}" | sort -u)
          MATRIX=$(echo "$UNIQUE" | jq -R -s -c 'split("\n") | map(select(length>0))')
          echo "Build matrix: $MATRIX"
          echo "images=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────
  # One job per changed Dockerfile, fanned out in parallel
  # ─────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.image }}
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        image: ${{ fromJson(needs.detect.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse image identifier
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          # matrix.image is like "claude/python" or "opencodeLLM/oc-python"
          DIR="${{ matrix.image }}"; DIR="${DIR%/*}"
          NAME="${{ matrix.image }}"; NAME="${NAME#*/}"

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "dockerfile=${DIR}/Dockerfile.${NAME}" >> "$GITHUB_OUTPUT"

          # Tag: claude-python:ci  /  oc-python:ci   (thrown away after the job)
          if [ "$DIR" = "claude" ]; then
            echo "tag=claude-${NAME}:ci" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${NAME}:ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Reclaim disk space
        shell: bash
        run: |
          # Free up ~10 GB on a stock ubuntu-latest runner before building
          # large language images.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          docker system prune -af --volumes 2>/dev/null || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.parse.outputs.dir }}/
          file: ${{ steps.parse.outputs.dockerfile }}
          tags: ${{ steps.parse.outputs.tag }}
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Smoke test ${{ matrix.image }}
        shell: bash
        run: |
          # Run a no-op as the default user to confirm the image is well-formed
          # (entrypoint resolves, default CMD doesn't immediately segfault, etc).
          # Use /bin/true so we don't accidentally launch claude/opencode.
          docker run --rm --entrypoint /bin/true "${{ steps.parse.outputs.tag }}"

  # ─────────────────────────────────────────────────────────
  # Aggregate result so branch-protection only needs one check
  # ─────────────────────────────────────────────────────────
  build-result:
    name: All builds succeeded
    runs-on: ubuntu-latest
    needs: [detect, build]
    if: always()
    steps:
      - name: Check outcomes
        shell: bash
        run: |
          if [ "${{ needs.detect.outputs.should_build }}" != "true" ]; then
            echo "No Dockerfiles needed building -- nothing to verify."
            exit 0
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more image builds failed."
            exit 1
          fi
          echo "All image builds succeeded."
